name: Nightly Forecast Publication & Deploy

on:
  schedule:
    # 22:40 ET is 02:40 UTC in EDT (summer) and 03:40 UTC in EST (winter)
    # Run at 02:40 UTC and 03:40 UTC to guarantee catching the 22:30-23:00 ET freeze window year-round
    - cron: '40 2 * * *'
    - cron: '40 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch existing web data
        run: |
          mkdir -p web
          curl -sSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/departures_data.json" -o web/departures_data.json || true
          curl -sSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/departures_data.js" -o web/departures_data.js || true

      - name: Run Live Collection & Publication Pipeline
        env:
          AEROAPI_KEY: ${{ secrets.AEROAPI_KEY }}
        run: |
          python -m rdu.ingest.live pipeline 25 || python -m rdu.publish

      - name: Deploy Updated Website to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          keep_files: true
          commit_message: "Auto-publish: nightly RDU forecasts and outcome updates [skip ci]"
